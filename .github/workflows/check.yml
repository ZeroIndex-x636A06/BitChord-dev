name: Check

on:
  push:
    branches: [main]
  pull_request:

# TEMPORARY (fork testing only): lets the test build publish itself as a release.
permissions:
  contents: write

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        shell: bash
        run: ./gradlew :shared:jvmTest :desktopApp:test --continue 2>&1 | tee gradle-desktop-test.log; exit ${PIPESTATUS[0]}

      - name: Build the distributable
        shell: bash
        run: ./gradlew :desktopApp:createDistributable 2>&1 | tee gradle-desktop-build.log; exit ${PIPESTATUS[0]}

      # TEMPORARY (fork testing only, drop before upstreaming): compiler errors and failed tests
      # as annotations, readable without the logs.
      - name: Surface build errors
        if: always()
        shell: bash
        run: |
          cat gradle-desktop-*.log 2>/dev/null \
            | grep -E -A4 '^e: |FAILED|What went wrong|AssertionError|Unresolved reference|Exception' \
            | sed 's/%/%25/g; s/\r//g' | head -250 > errors.txt || true
          split -l 25 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -s "$f" ] || continue
            msg=$(awk 'BEGIN{ORS="%0A"} {print}' "$f")
            echo "::error title=build-errors $f::${msg}"
          done

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      # TEMPORARY (fork testing only, drop before upstreaming): the Linux build as a download.
      - name: Package the Linux build for testing
        run: tar -czf bitchord-linux-test.tar.gz -C desktopApp/build/compose/binaries/main/app BitChord

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-desktop-linux
          path: bitchord-linux-test.tar.gz

      # TEMPORARY (fork testing only): a plain download link that works from a phone.
      - name: Publish to the test-explicit-home release
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/explicit-slim-home'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view test-explicit-home >/dev/null 2>&1 || gh release create test-explicit-home --prerelease \
            --title "Test build (fork only)" --notes "Fork-only test build. Not a release." \
            --target "${{ github.event.pull_request.head.sha }}"
          gh release upload test-explicit-home bitchord-linux-test.tar.gz --clobber

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: CMake version
        run: cmake --version

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-macos:
    name: Desktop · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      # TEMPORARY (fork testing only, drop before upstreaming): sign every test
      # build with the same debug key so a new build installs over the last.
      - name: Use the fork's fixed debug key
        run: mkdir -p ~/.android && cp .github/ci/debug.keystore ~/.android/debug.keystore

      - name: Tests
        # TEMPORARY (fork testing only): upstream main already fails a few
        # locale and live-network tests; don't let those block the test APK.
        continue-on-error: true
        shell: bash
        run: ./gradlew testDevDebugUnitTest --continue 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}

      - name: Build the dev APK
        shell: bash
        run: ./gradlew assembleDevDebug --continue 2>&1 | tee gradle-build.log; exit ${PIPESTATUS[0]}

      # TEMPORARY (fork testing only, drop before upstreaming): copies compiler
      # errors and failed tests into annotations so they can be read without the logs.
      - name: Surface build errors
        if: always()
        shell: bash
        run: |
          cat gradle-*.log 2>/dev/null \
            | grep -E -A4 '^e: |FAILED|What went wrong|AssertionError|Unresolved reference|Exception' \
            | sed 's/%/%25/g; s/\r//g' | head -250 > errors.txt || true
          split -l 25 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -s "$f" ] || continue
            msg=$(awk 'BEGIN{ORS="%0A"} {print}' "$f")
            echo "::error title=build-errors $f::${msg}"
          done

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      # TEMPORARY (fork testing only): a plain download link that works from a phone.
      - name: Publish to the test-explicit-home release
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/explicit-slim-home'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls app/build/outputs/apk/dev/debug/
          gh release view test-explicit-home >/dev/null 2>&1 || gh release create test-explicit-home --prerelease \
            --title "Test build (fork only)" --notes "Fork-only test build. Not a release." \
            --target "${{ github.event.pull_request.head.sha }}"
          apk=$(ls app/build/outputs/apk/dev/debug/*arm64*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls app/build/outputs/apk/dev/debug/*.apk | head -1)
          cp "$apk" bitchord-dev-test-arm64.apk
          gh release upload test-explicit-home bitchord-dev-test-arm64.apk --clobber
          gh release edit test-explicit-home --notes "Fork-only test build: slim explicit filter with Home (ci/explicit-slim-home @ ${{ github.event.pull_request.head.sha }}, run ${{ github.run_id }}). Install bitchord-dev-test-arm64.apk on the phone; bitchord-linux-test.tar.gz is the Linux desktop app. Not a release."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
