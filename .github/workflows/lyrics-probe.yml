name: lyric check probe
on:
  push:
    branches: [probe/lyrics-scores]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Kotlin compiler
        run: |
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kc.zip
      - name: Fetch lyrics (kept on the runner, never committed)
        run: python3 probe/fetch.py probe/songs.txt "$RUNNER_TEMP/lyrics"
      - name: Score with the app's own code
        run: |
          python3 probe/extract.py
          ./kotlinc/bin/kotlinc probe/ExplicitLyricsOnly.kt probe/Score.kt -include-runtime -d score.jar 2>&1 | grep -v warning || true
          java -cp score.jar probe.ScoreKt probe/songs.txt "$RUNNER_TEMP/lyrics" | tee scores.txt
          split -l 22 scores.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=scores $f::${msg}"
          done
